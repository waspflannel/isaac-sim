[project]
name = "factory-intelligence"
version = "0.1.0"
description = "Factory intelligence application and simulation development tools"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "simpy>=4.1,<5",
]

[project.scripts]
factory-base = "factory_intelligence.factory_base:main"
factory-simulate = "factory_intelligence.simulator:main"
factory-collect = "factory_intelligence.collector:main"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_intelligence"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
